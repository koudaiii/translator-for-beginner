[package]
name = "tfb"
version = "0.4.0"
edition = "2024"
rust-version = "1.96"
description = "英文を翻訳・解説・添削する CLI（Azure Translator / Azure OpenAI）"
publish = false

[dependencies]
anstream = "1"
anstyle = "1"
clap = { version = "4.6", features = ["derive"] }
clap_complete = "4.6"
reqwest = { version = "0.13", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "macros"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time"] }
wiremock = "0.6"
